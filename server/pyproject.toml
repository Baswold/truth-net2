[tool.poetry]
name = "truth-net-server"
version = "0.1.0"
description = "Backend service for the Truth Net platform"
authors = ["Truth Net Team <team@example.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
# Core web framework
fastapi = "^0.112.0"
pydantic = {version = "^2.8.2", extras=["email"]}
pydantic-settings = "^2.3.4"
uvicorn = {version = "^0.30.5", extras = ["standard"]}

# Database
sqlalchemy = "^2.0.31"
'psycopg[binary]' = "^3.2.1"
alembic = "^1.13.2"
sqlalchemy-utils = "^0.41.2"

# Authentication & Security
passlib = "^1.7.4"
bcrypt = "^4.1.3"
python-jose = "^3.3.0"
itsdangerous = "^2.2.0"  # Reserved: password reset, email verification

# Caching & Rate Limiting
redis = "^5.0.7"

# Search
meilisearch = "^0.30.1"

# Background Jobs (reserved for ingestion/scheduled tasks)
celery = "^5.4.0"
croniter = "^3.0.3"
arrow = "^1.3.0"

# Utilities
httpx = "^0.27.0"  # HTTP client for external APIs
python-multipart = "^0.0.9"  # Reserved: file uploads
pyyaml = "^6.0.2"  # Reserved: config files
python-dateutil = "^2.9.0"
python-slugify = "^8.0.4"  # Reserved: auto-generate slugs

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.2"
pytest-asyncio = "^0.23.8"
ruff = "^0.5.6"
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
